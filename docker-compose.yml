services:
  postgres:
    image: postgres:16-alpine
    container_name: payflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow123
      POSTGRES_DB: payflow_demo
    ports:
      - "5433:5432"
    volumes:
      - payflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow -d payflow_demo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  payflow_postgres_data:
